hero:
  eyebrow: Software Object Warehouse
  title_lines:
    - 构建软件仓库
    - 增量发布更新
  title_size: 4rem
  lead: 从本地 RPM 与 DEB 文件构建 YUM、APT 仓库。用 `sow create` 索引已有目录；用托管工作区（Managed）筛选软件包、签署元数据、保留快照并发布更新。
  note: SOW 0.6.0 · Linux + macOS · RPM + DEB · Apache-2.0
  image:
    light: img/sow-architecture-zh-light.svg
    dark: img/sow-architecture-zh-dark.svg
    alt: >-
      SOW Managed 模式：本地 .rpm 与 .deb 文件进入仓库包池，每个仓库内的软件包只存一份；
      多个 YUM 与 APT 视图共用包池，各自保存元数据；发布时只把发生变化的对象上传到
      文件系统或 Cloudflare R2 目标。
  media:
    # Hero 放的是架构图而不是图标：媒体列要足够宽才读得清，同时文案列仍能容纳不换行的
    # 两行产品主张。小于 lg 时图中标注已经看不清，因此直接隐藏而不是继续缩小。
    ratio: 1.2fr 0.8fr
    max_width: 440px
    hide_below: lg
  actions:
    - label: 上手
      url: /zh/docs/start/
      icon: fa-solid fa-arrow-right
      style: primary
    - label: 下载
      url: /zh/download/
      icon: fa-solid fa-download
      style: ghost
    - label: 0.6 版本变化
      url: /zh/blog/release/sow-v0.6.0/
      icon: fa-solid fa-tag
      style: ghost

capabilities:
  eyebrow: 两种建库方式
  title: 选择平面模式或托管模式
  text: Plain 模式索引目录内的软件包。Managed 模式管理软件包选择、构建记录与发布历史。
  items:
    - ref: 01 / 快速创建
      title: 索引软件包目录
      url: /zh/docs/command/create/
      motto: 直接把装有软件包的目录交给 SOW
      bullets:
        - '`sow create` 就地索引目录顶层的 RPM 与 DEB 文件'
        - 生成 rpm-md 元数据与 APT Packages 索引
        - 更新后保留当前与上一轮 RPM 元数据
      value: 用静态 HTTP 服务器提供生成后的目录。
      visual:
        type: code
        aria_label: 创建平面 RPM 与 DEB 仓库
        title: create.sh
        lines:
          - { class: p, prefix: '$ ', text: 'sow create /srv/repo --jobs 8' }
          - { class: p, prefix: '$ ', text: 'python3 -m http.server 8080 --bind 127.0.0.1 --directory /srv/repo' }
    - ref: 02 / 托管模式
      title: 一份包体，多个托管视图
      url: /zh/docs/feature/managed/
      motto: 统一管理 Enterprise Linux、Debian 与 Ubuntu 仓库
      bullets:
        - 每个仓库内，每个软件包只保存一份包体
        - 多个发行版与架构视图共用同一份包体
        - 记录构建历史，保留指定快照
      value: 为各个发行版选择软件包，并构建索引。
      visual:
        type: components
        aria_label: 托管仓库模型
        columns: 2
        items:
          - { icon: fa-brands fa-redhat, title: EL, detail: rpm-md 视图, url: /zh/docs/tutorial/yum-repo/ }
          - { icon: fa-brands fa-debian, title: Debian, detail: APT 视图, url: /zh/docs/tutorial/apt-repo/ }
          - { icon: fa-brands fa-ubuntu, title: Ubuntu, detail: APT 视图, url: /zh/docs/tutorial/apt-repo/ }
          - { icon: fa-solid fa-box-archive, title: 共享包池, detail: 包体去重, url: /zh/docs/feature/views/ }
          - { icon: fa-solid fa-camera, title: 构建快照, detail: Generation, url: /zh/docs/feature/transactions/ }
          - { icon: fa-solid fa-code-branch, title: 软件包集合, detail: Dist, url: /zh/docs/reference/config/ }
    - ref: 03 / 开箱即用
      title: 一个可执行文件
      url: /zh/download/
      motto: macOS 与 Linux 使用一致的命令接口
      bullets:
        - 提供 Linux、macOS 的 `amd64` 与 `arm64` 归档
        - 提供 Linux 的 RPM 与 DEB 安装包
        - 内置软件包解析与元数据生成功能
      value: 直接运行 SOW 命令。Managed 状态保存在内嵌 SQLite 数据库中。
      visual:
        type: components
        aria_label: 支持的发布平台
        columns: 2
        items:
          - { icon: fa-brands fa-linux, title: Linux, detail: amd64 · arm64 }
          - { icon: fa-brands fa-apple, title: macOS, detail: Intel · Apple Silicon }
          - { icon: fa-solid fa-box, title: RPM, detail: x86_64 · aarch64 }
          - { icon: fa-solid fa-box-open, title: DEB, detail: amd64 · arm64 }
    - ref: 04 / 增量同步
      title: 发布仓库更新
      url: /zh/docs/command/publish/
      motto: 发布到文件系统或 Cloudflare R2
      bullets:
        - '`sow changes` 列出两次本地构建之间的文件变化'
        - 发布时比较当前构建与目标上次发布的内容
        - 上传变化文件，并保存发布记录
      value: 在 `sow.yml` 中配置目标，然后运行 `sow publish TARGET`。
      visual:
        type: code
        aria_label: 检查本地变更并发布仓库
        title: publish.sh
        lines:
          - { class: p, prefix: '$ ', text: 'sow changes -r pgsql' }
          - { class: p, prefix: '$ ', text: 'sow publish prod' }
          - { class: p, prefix: '$ ', text: 'sow status -r pgsql' }

principles:
  eyebrow: 运行模型
  title: 构建、检查、发布
  desc: 分别管理软件包选择、本地构建和远端发布。
  columns: 3
  items:
    - icon: fa-solid fa-rotate
      title: 重建本地索引
      desc: Plain 模式每次读取目录。添加或删除软件包文件后，再运行 `sow create`。
    - icon: fa-solid fa-list-check
      title: 查看构建状态
      desc: Managed 模式记录软件包选择与已完成的构建。运行 `sow status` 查看是否需要构建。
    - icon: fa-solid fa-shield-halved
      title: 发布前检查
      desc: 运行 `sow check` 校验 Managed 仓库。运行 `sow publish TARGET` 更新已配置的目标。

faq:
  eyebrow: 常见问题
  title: 选择适合的流程
  desc: 两种模式使用同一个 SOW 可执行文件。
  items:
    - question: 我应该从 Plain 还是 Managed 模式开始？
      answer: |
        索引已有软件包目录时，使用 [Plain 模式](/zh/docs/start/quickstart/)。需要按发行版选择软件包、设置版本保留规则、签署元数据或发布更新时，使用 [Managed 工作区](/zh/docs/start/workspace/)。
      open: true
    - question: 可以替换现有的 createrepo_c 工作流吗？
      answer: |
        使用 RPM XML 元数据的仓库可以替换。通过 `--metadata-timestamp` 保持发布时间递增；如果客户端要求索引签名，构建后签署最终索引。操作步骤与元数据格式见 [YUM 迁移指南](/zh/docs/tutorial/yum-migration/)。
    - question: 签署 RPM 包时，也会签署仓库索引吗？
      answer: |
        `--sign-with` 为未签名 RPM 包补签。Plain 模式需要在最后一次建库后单独签署 `repomd.xml`；Managed 模式通过配置管理元数据签名策略。两种流程见[仓库签名](/zh/docs/tutorial/signing/)。
    - question: SOW 能同时处理 RPM 与 DEB 软件包吗？
      answer: |
        可以。Plain 目录可同时放置 RPM 与 DEB 软件包。在 Managed 模式中，每个 Dist 只有一种格式，同一个仓库可以包含多个 RPM 与 DEB Dist。
    - question: SOW 需要守护进程或数据库服务吗？
      answer: |
        不需要。SOW 通过命令生成静态文件，Managed 模式使用本地 SQLite 数据库。用静态 HTTP 服务器提供包含 `pool/` 与 `dists/` 的仓库根目录。
    - question: Managed 仓库可以发布到哪里？
      answer: |
        可以发布到本地或挂载的[文件系统，也可以发布到 Cloudflare R2](/zh/docs/command/publish/)。每个目标单独记录发布检查点，`sow publish` 据此选择下次需要更新的文件。

