# Landing page counters. These are product facts, not adoption numbers — every
# value must stay verifiable against the documentation page the stat links to.

# RPM (YUM) and DEB (APT).
package_formats: 2

# linux/amd64, linux/arm64, darwin/amd64, darwin/arm64.
platforms: 4

# Canonical-repository client combinations exercised end to end: EL8 / EL9 / EL10
# dnf, CentOS 7 yum, Debian 12 apt, Debian 13 apt. reposync uses an explicit
# exported compatibility leaf and is not counted here.
client_generations: 6

# Static CGO_ENABLED=0 binary: nothing to install alongside it.
external_deps: 0
