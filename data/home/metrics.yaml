# Landing page counters. These are product facts, not adoption numbers — every
# value must stay verifiable against the documentation page the stat links to.

# RPM (YUM) and DEB (APT).
package_formats: 2

# linux/amd64, linux/arm64, darwin/amd64, darwin/arm64.
platforms: 4

# Provider implementations accepted by the v0.2.0 configuration parser:
# a pre-existing local filesystem directory and Cloudflare R2.
publication_providers: 2

# CGO_ENABLED=0 executable: no separately installed language runtime.
external_deps: 0
