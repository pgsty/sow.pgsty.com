hero:
  eyebrow: Software Object Warehouse
  title_lines:
    - Build package repositories
    - Publish what changed
  title_size: 4rem
  lead: Build YUM and APT repositories from local RPM and DEB files. Index an existing directory with `sow create`. Use a Managed workspace to select packages, sign metadata, keep snapshots, and publish updates.
  note: SOW 0.6.0 · Linux + macOS · RPM + DEB · Apache-2.0
  image:
    light: img/sow-architecture-light.svg
    dark: img/sow-architecture-dark.svg
    alt: >-
      SOW Managed mode: local .rpm and .deb files enter a repository's package pool,
      which stores each package body once. YUM and APT views share that pool
      and hold their own metadata. Publication uploads the
      changed objects alone to a filesystem or Cloudflare R2 target.
  media:
    # The hero carries an architecture diagram rather than an emblem, so the
    # media column is wide enough to read and the copy column still holds the
    # two-line product promise without wrapping. Below lg the diagram's labels
    # get too small to read, so it leaves rather than shrinks.
    ratio: 1.2fr 0.8fr
    max_width: 440px
    hide_below: lg
  actions:
    - label: Get Started
      url: /docs/start/
      icon: fa-solid fa-arrow-right
      style: primary
    - label: Download
      url: /download/
      icon: fa-solid fa-download
      style: ghost
    - label: What's new in 0.6
      url: /blog/release/sow-v0.6.0/
      icon: fa-solid fa-tag
      style: ghost

capabilities:
  eyebrow: Two ways to build
  title: Choose Plain or Managed
  text: Plain mode indexes the packages in a directory. Managed mode tracks package selection, builds, and publication.
  items:
    - ref: 01 / CREATE
      title: Index a package directory
      url: /docs/command/create/
      motto: Point SOW at a directory of packages
      bullets:
        - '`sow create` indexes top-level RPM and DEB files in place'
        - Produces rpm-md metadata and APT Packages indexes
        - Keeps current and previous RPM metadata after updates
      value: Serve the resulting directory with a static HTTP server.
      visual:
        type: code
        aria_label: Create a flat RPM and DEB repository
        title: create.sh
        lines:
          - { class: p, prefix: '$ ', text: 'sow create /srv/repo --jobs 8' }
          - { class: p, prefix: '$ ', text: 'python3 -m http.server 8080 --bind 127.0.0.1 --directory /srv/repo' }
    - ref: 02 / MANAGED
      title: One pool, many views
      url: /docs/feature/managed/
      motto: Curate Enterprise Linux, Debian, and Ubuntu repositories
      bullets:
        - Stores one copy of each package per repository
        - Shares that copy across distributions and architecture views
        - Keeps build history and selected snapshots
      value: Choose packages for each distribution and build its indexes.
      visual:
        type: components
        aria_label: Managed repository model
        columns: 2
        items:
          - { icon: fa-brands fa-redhat, title: EL, detail: rpm-md views, url: /docs/tutorial/yum-repo/ }
          - { icon: fa-brands fa-debian, title: Debian, detail: APT views, url: /docs/tutorial/apt-repo/ }
          - { icon: fa-brands fa-ubuntu, title: Ubuntu, detail: APT views, url: /docs/tutorial/apt-repo/ }
          - { icon: fa-solid fa-box-archive, title: One Pool, detail: deduplicated payload, url: /docs/feature/views/ }
          - { icon: fa-solid fa-camera, title: Generations, detail: immutable manifests, url: /docs/feature/transactions/ }
          - { icon: fa-solid fa-code-branch, title: Package sets, detail: Dists, url: /docs/reference/config/ }
    - ref: 03 / READY TO RUN
      title: One executable
      url: /download/
      motto: The same CLI on macOS and Linux
      bullets:
        - Linux and macOS archives for `amd64` and `arm64`
        - RPM and DEB installation packages for Linux
        - Built-in package parsing and metadata generation
      value: Run SOW as a command. Managed state uses an embedded SQLite database.
      visual:
        type: components
        aria_label: Supported release targets
        columns: 2
        items:
          - { icon: fa-brands fa-linux, title: Linux, detail: amd64 · arm64 }
          - { icon: fa-brands fa-apple, title: macOS, detail: Intel · Apple Silicon }
          - { icon: fa-solid fa-box, title: RPM, detail: x86_64 · aarch64 }
          - { icon: fa-solid fa-box-open, title: DEB, detail: amd64 · arm64 }
    - ref: 04 / INCREMENTAL
      title: Publish repository updates
      url: /docs/command/publish/
      motto: Publish to a filesystem or Cloudflare R2 target
      bullets:
        - '`sow changes` lists file changes between local builds'
        - Publication compares the current build with the target’s last publication
        - Uploads changed files and records the result
      value: Configure a target in `sow.yml`, then run `sow publish TARGET`.
      visual:
        type: code
        aria_label: Inspect local changes and publish the repository
        title: publish.sh
        lines:
          - { class: p, prefix: '$ ', text: 'sow changes -r pgsql' }
          - { class: p, prefix: '$ ', text: 'sow publish prod' }
          - { class: p, prefix: '$ ', text: 'sow status -r pgsql' }

principles:
  eyebrow: Operating model
  title: Build, check, publish
  desc: Keep package selection, local builds, and remote publication separate.
  columns: 3
  items:
    - icon: fa-solid fa-rotate
      title: Rebuild local indexes
      desc: Plain mode reads the directory each time. Run `sow create` again after adding or removing package files.
    - icon: fa-solid fa-list-check
      title: Inspect the current build
      desc: Managed mode records package selections and completed builds. Use `sow status` to see whether a build is needed.
    - icon: fa-solid fa-shield-halved
      title: Check before publication
      desc: Run `sow check` to validate a Managed repository. Use `sow publish TARGET` to update a configured target.

faq:
  eyebrow: Common questions
  title: Choose a workflow
  desc: Use the same SOW executable for both modes.
  items:
    - question: Should I start with Plain or Managed mode?
      answer: |
        Use [Plain mode](/docs/start/quickstart/) to index an existing package directory. Use a [Managed workspace](/docs/start/workspace/) to select packages per distribution, apply retention rules, sign metadata, and publish updates.
      open: true
    - question: Can I replace an existing createrepo_c workflow?
      answer: |
        Yes, for repositories that use RPM XML metadata. Preserve the publication timestamp with `--metadata-timestamp` and sign the final index if clients require it. See the [YUM migration guide](/docs/tutorial/yum-migration/) for the steps and supported metadata formats.
    - question: Does RPM signing also sign the repository index?
      answer: |
        `--sign-with` signs unsigned RPM packages. In Plain mode, sign `repomd.xml` separately after the final metadata build. Managed mode provides configured metadata-signing policies. See [Signing](/docs/tutorial/signing/) for both workflows.
    - question: Can SOW handle RPM and DEB packages together?
      answer: |
        Yes. A Plain directory can contain both RPM and DEB packages. In Managed mode, each Dist has one format. One repository can contain multiple RPM and DEB Dists.
    - question: Does SOW need a daemon or database service?
      answer: |
        No. SOW runs as a command and generates static files. Managed mode uses a local SQLite database. Serve the Repository root, which contains `pool/` and `dists/`, with a static HTTP server.
    - question: Where can a Managed repository be published?
      answer: |
        Publish to a local or mounted [filesystem, or Cloudflare R2](/docs/command/publish/). Each target records its own checkpoint. `sow publish` uses that checkpoint to select the files for the next update.

