capabilities:
  eyebrow: Core capabilities
  title: Flat or Managed
  text: Use the one-command path for a local repository, or keep package membership, immutable generations, and publication history in a Managed workspace.
  items:
    - ref: 01 / CREATE
      title: Create repo in one command
      url: docs/command/create/
      motto: Point SOW at a directory of packages
      bullets:
        - '`sow create` indexes top-level RPM and DEB files in place'
        - Produces a directly usable flat YUM/APT repository
        - Replaces basic `createrepo_c`, `dpkg-scanpackages`, or simple `reprepro` indexing flows
      value: From package files to repository metadata without a daemon or toolchain.
      visual:
        type: code
        aria_label: Create a flat RPM and DEB repository
        title: create.sh
        lines:
          - { class: p, prefix: '$ ', text: 'sow create /srv/repo --jobs 8' }
          - { class: ok, prefix: '✓ ', text: 'repodata/repomd.xml' }
          - { class: ok, prefix: '✓ ', text: Packages }
          - { class: ok, prefix: '✓ ', text: Packages.gz }
    - ref: 02 / MANAGED
      title: One pool, many views
      url: docs/feature/managed/
      motto: Curate Enterprise Linux, Debian, and Ubuntu repositories
      bullets:
        - Stores each live package once per Repository and projects metadata-only Dists
        - Avoids duplicate object keys and redundant uploads on object storage
        - Records immutable Built Generation manifests for retained snapshots and repository variants
      value: Desired membership, policies, signing, and snapshots remain explicit and auditable.
      visual:
        type: components
        aria_label: Managed repository model
        columns: 2
        items:
          - { icon: fa-brands fa-redhat, title: EL, detail: rpm-md views, url: docs/tutorial/yum-repo/ }
          - { icon: fa-brands fa-debian, title: Debian, detail: APT views, url: docs/tutorial/apt-repo/ }
          - { icon: fa-brands fa-ubuntu, title: Ubuntu, detail: APT views, url: docs/tutorial/apt-repo/ }
          - { icon: fa-solid fa-box-archive, title: One Pool, detail: deduplicated payload, url: docs/feature/views/ }
          - { icon: fa-solid fa-camera, title: Generations, detail: immutable manifests, url: docs/feature/transactions/ }
          - { icon: fa-solid fa-code-branch, title: Variants, detail: Dists and targets, url: docs/reference/config/ }
    - ref: 03 / READY TO RUN
      title: One binary, production ready
      url: download/
      motto: The same executable on macOS and Linux
      bullets:
        - Self-contained `CGO_ENABLED=0` archives for `amd64` and `arm64`
        - The release pipeline produces RPM and DEB installation packages for Linux
        - Safe paths, bounded concurrency, fsync, atomic publication, and strict checks
      value: No repository daemon and no runtime language environment to operate.
      visual:
        type: components
        aria_label: Supported release targets
        columns: 2
        items:
          - { icon: fa-brands fa-linux, title: Linux, detail: amd64 · arm64 }
          - { icon: fa-brands fa-apple, title: macOS, detail: Intel · Apple Silicon }
          - { icon: fa-solid fa-box, title: RPM, detail: x86_64 · aarch64 }
          - { icon: fa-solid fa-box-open, title: DEB, detail: amd64 · arm64 }
    - ref: 04 / INCREMENTAL
      title: Publish only the change set
      url: docs/command/changes/
      motto: Inspect first, then synchronize
      bullets:
        - '`sow changes` reports payload, metadata, pointer, and removal records'
        - The operation log preserves who changed what and when
        - Publication uses recorded target state to upload the delta instead of every repository object
      value: Small repository changes stay small when synchronized to filesystem or cloud targets.
      visual:
        type: code
        aria_label: Inspect and publish an incremental change set
        title: publish.sh
        lines:
          - { class: p, prefix: '$ ', text: 'sow changes -r pgsql' }
          - { class: ok, prefix: '+ ', text: 'pool/p/postgresql-18/...' }
          - { class: ok, prefix: '~ ', text: 'dists/el9/x86_64/repodata/...' }
          - { class: p, prefix: '$ ', text: 'sow publish prod' }
          - { class: ok, prefix: '✓ ', text: 'changed objects verified' }

principles:
  eyebrow: Operating model
  title: Simple at the start, explicit under control
  desc: SOW keeps the easy path rebuildable and makes every managed delivery decision visible.
  columns: 3
  items:
    - icon: fa-solid fa-rotate
      title: Rebuild derived state
      desc: Plain mode treats repository metadata as a deterministic result of the package directory. Change the inputs, then run `sow create` again.
    - icon: fa-solid fa-list-check
      title: Own managed intent
      desc: Managed mode separates Desired Membership from immutable Built Generations, so policy and publication never become hidden side effects.
    - icon: fa-solid fa-shield-halved
      title: Verify before delivery
      desc: Checks, signatures, operation history, and atomic publication turn a repository build into an auditable release boundary.

faq:
  eyebrow: Common questions
  title: Choose the smallest workflow that fits
  desc: Plain and Managed use the same binary, but solve different operating problems.
  items:
    - question: Should I start with Plain or Managed mode?
      answer: |
        Start with [Plain mode](docs/start/quickstart/) when the directory already contains exactly what you want to serve. Use a [Managed workspace](docs/start/workspace/) when SOW must own membership, policy, signed metadata, immutable generations, audit history, or publication targets.
      open: true
    - question: Can SOW handle RPM and DEB packages together?
      answer: |
        Yes. A Plain directory can contain both RPM and DEB packages. In Managed mode, each Dist has one format, while one Repository can expose multiple RPM and DEB Dists from its shared public tree.
    - question: Does SOW need a daemon or database service?
      answer: |
        No. SOW is a self-contained CLI and emits static repository files. Managed workspaces keep their embedded state locally; serve only the generated public tree with the HTTP server you already operate.
    - question: Where can a Managed repository be published?
      answer: |
        A configured target can be a local or mounted [filesystem, or Cloudflare R2 object storage](docs/command/publish/). `sow changes` shows the delta before publication, and SOW records the target state for the next incremental run.

