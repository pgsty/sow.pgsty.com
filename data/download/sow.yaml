# SOW install channels, consumed by the download landing section and by the
# `download` shortcode. `version` is deliberately absent so the record follows
# params.version in hugo.yaml, and `tag` defaults to v{version} -- one place to
# bump at release time.
#
# Only pinned channels may interpolate ${version} and ${tag}. The Pigsty
# repository channel is rolling on purpose: it tracks whatever the infra
# repository currently serves, which is not necessarily this tag.
repo: pgsty/sow
published: true # Set true only after the matching GitHub Release is public.
channels:
  - id: pigsty
    kind: rolling
    title: Pigsty Repo
    title_zh: Pigsty 软件源
    icon: fa-solid fa-cloud-arrow-down
    note: >-
      On Linux, install and update SOW with APT or DNF from the Pigsty infra
      repository. This channel follows the repository version. In mainland
      China, use the `repo.pigsty.cc` mirror. The APT example marks the source
      as trusted with `trusted=yes`. The DNF example disables RPM package
      signature checks with `gpgcheck=0`.
    note_zh: >-
      在 Linux 上，通过 Pigsty infra 软件源用 APT 或 DNF 安装和更新 SOW。
      此渠道跟随软件源中的版本。中国大陆可使用 `repo.pigsty.cc` 镜像。
      APT 示例通过 `trusted=yes` 将该源标为可信；DNF 示例通过 `gpgcheck=0` 关闭 RPM 包签名检查。
    steps:
      - title: APT · Debian / Ubuntu
        title_zh: APT · Debian / Ubuntu
        lang: bash
        code: |
          sudo tee /etc/apt/sources.list.d/pigsty-infra.list > /dev/null <<'EOF'
          deb [trusted=yes] https://repo.pigsty.io/apt/infra generic main
          EOF

          sudo apt update
          sudo apt install -y sow
      - title: YUM · RHEL / Rocky / Alma / Anolis
        title_zh: YUM · RHEL / Rocky / Alma / Anolis
        lang: bash
        code: |
          sudo tee /etc/yum.repos.d/pigsty-infra.repo > /dev/null <<'EOF'
          [pigsty-infra]
          name=Pigsty Infra for $basearch
          baseurl=https://repo.pigsty.io/yum/infra/$basearch
          enabled=1
          gpgcheck=0
          module_hotfixes=1
          EOF

          sudo dnf makecache
          sudo dnf install -y sow
      - title: Mainland China mirror
        title_zh: 中国大陆镜像
        lang: bash
        code: |
          # Same paths, different host: repo.pigsty.io -> repo.pigsty.cc

          # APT
          sudo sed -i 's|repo.pigsty.io|repo.pigsty.cc|' /etc/apt/sources.list.d/pigsty-infra.list
          sudo apt update

          # YUM
          sudo sed -i 's|repo.pigsty.io|repo.pigsty.cc|' /etc/yum.repos.d/pigsty-infra.repo
          sudo dnf makecache

  - id: packages
    kind: pinned
    title: RPM / DEB
    title_zh: RPM / DEB
    icon: fa-solid fa-box-archive
    url: https://github.com/pgsty/sow/releases/tag/${tag}
    note: >-
      Use these packages to install a specific version or prepare an offline
      installation. They carry the `1PGSTY` release suffix, install SOW at
      `/usr/bin/sow`, and ship the Apache-2.0 licence and third-party notices.
    note_zh: >-
      需要固定版本或离线安装时，选择以下安装包。安装包带 `1PGSTY` 发布后缀，把可执行文件
      装到 `/usr/bin/sow`，并随包安装 Apache-2.0 许可证与第三方许可声明。
    steps:
      - title: RPM · x86_64 / aarch64
        title_zh: RPM · x86_64 / aarch64
        lang: bash
        code: |
          ARCH=$(uname -m)
          curl -fLO "https://github.com/pgsty/sow/releases/download/${tag}/sow-${version}-1PGSTY.$ARCH.rpm"
          sudo rpm -Uvh "sow-${version}-1PGSTY.$ARCH.rpm"
      - title: DEB · amd64 / arm64
        title_zh: DEB · amd64 / arm64
        lang: bash
        code: |
          ARCH=$(dpkg --print-architecture)
          curl -fLO "https://github.com/pgsty/sow/releases/download/${tag}/sow_${version}-1PGSTY_$ARCH.deb"
          sudo apt install "./sow_${version}-1PGSTY_$ARCH.deb"

  - id: archive
    kind: pinned
    title: Archive
    title_zh: 二进制归档
    icon: fa-solid fa-box-open
    note: >-
      Use an archive on Linux or macOS when you want to choose the installation
      directory. Builds are available for `amd64` and `arm64`.
      Archives include the executable, documentation, and license files.
    note_zh: >-
      在 Linux 或 macOS 上自行指定安装目录时，选择二进制归档。支持 `amd64` 与 `arm64`。
      归档包含可执行文件、文档与许可文件。
    steps:
      - title: Linux · amd64
        title_zh: Linux · amd64
        lang: bash
        code: |
          # Swap linux_amd64 for linux_arm64, darwin_amd64, or darwin_arm64.
          curl -fLO https://github.com/pgsty/sow/releases/download/${tag}/sow_${version}_linux_amd64.tar.gz
          tar -xzf sow_${version}_linux_amd64.tar.gz
          sudo install -m 0755 sow /usr/local/bin/sow

          sow version
      - title: macOS · Apple Silicon
        title_zh: macOS · Apple Silicon
        lang: bash
        code: |
          curl -fLO https://github.com/pgsty/sow/releases/download/${tag}/sow_${version}_darwin_arm64.tar.gz
          tar -xzf sow_${version}_darwin_arm64.tar.gz
          mkdir -p ~/.local/bin
          install -m 0755 sow ~/.local/bin/sow

          export PATH="$HOME/.local/bin:$PATH"
          sow version
          sow help

  - id: source
    kind: pinned
    title: Source
    title_zh: 源码构建
    icon: fa-solid fa-code-branch
    url: https://github.com/pgsty/sow/tree/${tag}
    note: >-
      Install Go 1.27.3 or newer, then build the release tag with the commands
      below. No C compiler is required. The build flags set the version shown
      by `sow version`.
    note_zh: >-
      先安装 Go 1.27.3 或更新版本，再按以下命令构建发布标签。无需 C 编译器。
      构建参数会设置 `sow version` 显示的版本号。
    steps:
      - title: Clone, check out, build
        title_zh: 克隆、检出、构建
        lang: bash
        code: |
          git clone https://github.com/pgsty/sow.git
          cd sow
          git checkout ${tag}

          SOW_BUILD_DIR="$(mktemp -d)"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X github.com/pgsty/sow/internal/v2cli.Version=${version}" \
            -o "$SOW_BUILD_DIR/sow" ./cmd/sow
          sudo install -m 0755 "$SOW_BUILD_DIR/sow" /usr/local/bin/sow

  - id: assets
    kind: pinned
    title: SHA256SUMS
    title_zh: SHA256SUMS
    icon: fa-solid fa-shield-halved
    url: https://github.com/pgsty/sow/releases/download/${tag}/SHA256SUMS
    checksums_src: release/sow-checksums.txt
    note: >-
      Download `SHA256SUMS` from the same release as your package or archive.
      Before installation, set `ASSET` to the downloaded file name and check
      its SHA-256 digest with the command for your operating system.
    note_zh: >-
      从软件包或归档对应的版本下载 `SHA256SUMS`。安装前，将 `ASSET` 设为已下载的文件名，
      用对应操作系统的命令检查 SHA-256 摘要。
    steps:
      - title: Verify one artifact
        title_zh: 校验单个制品
        lang: bash
        code: |
          ASSET=sow_${version}_linux_amd64.tar.gz
          curl -fLO https://github.com/pgsty/sow/releases/download/${tag}/SHA256SUMS

          # Linux
          grep "  $ASSET$" SHA256SUMS | sha256sum -c -
          # macOS
          grep "  $ASSET$" SHA256SUMS | shasum -a 256 -c -
    # Use the matching release's SHA256SUMS; never reuse a previous release's digests.
