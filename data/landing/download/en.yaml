# The /download/ page: a hero, the install matrix, and where to go next. The
# matrix itself is not described here -- the `download` section reads
# data/download/sow.yaml, so version-bound commands, links, and asset digests
# have exactly one source and cannot drift from the artifacts they name.
#
# Update the version note and availability text with params.version in hugo.yaml.
sections:
  - hero
  # Wrapped in the theme's content scope so the install commands keep the
  # framed code-block treatment; see layouts/_partials/sow/content-section.html.
  - type: download
    partial: sow/content-section
  - type: cards
    key: next
  - cta

hero:
  eyebrow: SOW for Linux and macOS
  title: Download SOW
  desc: 'Install from the Pigsty repository, download a versioned package or archive, or build from source. Choose the file for your operating system and architecture.'
  note: SOW 0.6.0 · Linux · macOS · amd64 / arm64 · RPM + DEB · Apache-2.0
  note_icon: fa-solid fa-box-archive
  align: center
  title_size: 3.4rem
  actions:
    - label: Published releases on GitHub
      url: 'https://github.com/pgsty/sow/releases'
      icon: fa-brands fa-github
      style: primary
      external: true
    - label: Installation guide
      url: /docs/start/install/
      icon: fa-solid fa-cloud-arrow-down
      style: ghost

download:
  eyebrow: Installation
  title: Choose an installation method
  desc: 'This site targets SOW 0.6.0. Versioned downloads will open when the release is published. The Pigsty repository follows its packaged version.'
  keys: [sow]

next:
  eyebrow: Next steps
  title: Create and serve a repository
  columns: 3
  link_label: Read
  items:
    - title: Quick Start
      meta: Start
      icon: fa-solid fa-bolt
      desc: Build a flat repository from a directory of RPM and DEB files.
      url: /docs/start/quickstart/
    - title: First Workspace
      meta: Start
      icon: fa-solid fa-folder-tree
      desc: Create a Managed workspace to select packages and keep build history.
      url: /docs/start/workspace/
    - title: CLI Reference
      meta: Reference
      icon: fa-solid fa-terminal
      desc: Look up command syntax, options, output, and exit codes.
      url: /docs/command/
    - title: Serve a repository
      meta: Tutorial
      icon: fa-solid fa-server
      desc: Configure an HTTP server so clients can download packages.
      url: /docs/tutorial/serving/
    - title: Compatibility
      meta: Reference
      icon: fa-solid fa-table-list
      desc: Check supported platforms, repository formats, clients, and storage targets.
      url: /docs/reference/compatibility/
    - title: Release notes
      meta: History
      icon: fa-solid fa-clock-rotate-left
      desc: Read version changes and upgrade instructions.
      url: /blog/release/

cta:
  title: Build your first repository
  actions:
    - label: Get Started
      url: /docs/start/
      icon: fa-solid fa-arrow-right
      style: primary
    - label: pgsty/sow
      url: 'https://github.com/pgsty/sow'
      icon: fa-brands fa-github
      style: ghost
      external: true
