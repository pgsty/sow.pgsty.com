<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SOW — self-contained APT / YUM repository manager</title>
  <desc id="desc">SOW by Pigsty: one static binary that builds and manages APT and YUM package repositories.</desc>

  <defs>
    <linearGradient id="card-leaf" x1="820" y1="470" x2="1090" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d7f77"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="card-crate" x1="840" y1="470" x2="1060" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b1119"/>
  <rect x="740" width="460" height="630" fill="#0e2b2a" fill-opacity="0.6"/>

  <g fill="none" stroke="#5eead4" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 48h1200M0 96h1200M0 144h1200M0 192h1200M0 240h1200M0 288h1200M0 336h1200M0 384h1200M0 432h1200M0 480h1200M0 528h1200M0 576h1200"/>
    <path d="M48 0v630M96 0v630M144 0v630M192 0v630M240 0v630M288 0v630M336 0v630M384 0v630M432 0v630M480 0v630M528 0v630M576 0v630M624 0v630M672 0v630M720 0v630M768 0v630M816 0v630M864 0v630M912 0v630M960 0v630M1008 0v630M1056 0v630M1104 0v630M1152 0v630"/>
  </g>

  <!-- Sprout emblem, scaled from static/img/sow.svg -->
  <g transform="translate(710 132) scale(3.1)">
    <g fill="url(#card-leaf)">
      <path d="M 59.5 86 C 59.5 66 60.5 50 64 28 C 67.5 50 68.5 66 68.5 86 Z"/>
      <path d="M 62 72 Q 55.2 39.4 22 42 Q 28.8 74.6 62 72 Z"/>
      <path d="M 66 62 Q 98 63 106 32 Q 74 31 66 62 Z"/>
    </g>
    <rect x="36" y="84" width="56" height="24" rx="6" fill="url(#card-crate)"/>
    <rect x="59.5" y="84" width="9" height="24" fill="#0b1119" fill-opacity="0.32"/>
    <rect x="36" y="94" width="56" height="4" fill="#0b1119" fill-opacity="0.26"/>
  </g>

  <g transform="translate(86 78)">
    <rect width="368" height="38" rx="19" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.55"/>
    <circle cx="22" cy="19" r="5" fill="#14b8a6"/>
    <text x="38" y="25" fill="#9beadd" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2.2">PGSTY / OPEN SOURCE</text>
  </g>

  <text x="82" y="310" fill="#2ed3bd" font-family="Arial" font-size="166" font-weight="800">SOW</text>
  <rect x="86" y="341" width="600" height="3" fill="#0d7f77"/>
  <text x="86" y="397" fill="#f2f8fb" font-family="Arial" font-size="30" font-weight="700" letter-spacing="0.8">APT / YUM REPOSITORY MANAGER</text>
  <text x="86" y="450" fill="#a9bac5" font-family="Arial" font-size="24">One binary  ·  Two formats  ·  No createrepo_c, no reprepro</text>

  <g transform="translate(86 520)">
    <rect width="322" height="52" rx="8" fill="#07121c" stroke="#14b8a6" stroke-opacity="0.45"/>
    <text x="22" y="34" fill="#d6fbf3" font-family="Menlo" font-size="22">sow.pgsty.com</text>
  </g>
  <text x="1114" y="558" fill="#7f9aa8" font-family="Arial" font-size="18" text-anchor="end">Maintained by Pigsty</text>
</svg>
