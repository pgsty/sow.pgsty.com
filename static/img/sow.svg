<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="128" height="128" viewBox="0 0 128 128"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="sow-title sow-desc"
     shape-rendering="geometricPrecision">
  <title id="sow-title">SOW emblem</title>
  <desc id="sow-desc">A sprout rising out of a sealed package crate: a tapered stem with two leaves.</desc>

  <defs>
    <linearGradient id="sow-leaf" x1="22" y1="86" x2="106" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d7f77"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="sow-crate" x1="36" y1="108" x2="92" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0b1119"/>
  <rect x="1.75" y="1.75" width="124.5" height="124.5" rx="26.25"
        fill="none" stroke="#14b8a6" stroke-opacity="0.28" stroke-width="3.5"/>

  <g fill="url(#sow-leaf)">
    <!-- Tapered stem, anchored inside the crate and pointed at the crown. -->
    <path d="
      M 59.5 86
      C 59.5 66 60.5 50 64 28
      C 67.5 50 68.5 66 68.5 86
      Z"/>

    <!-- Left leaf: lower, broader. -->
    <path d="
      M 62 72
      Q 55.2 39.4 22 42
      Q 28.8 74.6 62 72
      Z"/>

    <!-- Right leaf: higher, slightly slimmer. -->
    <path d="
      M 66 62
      Q 98 63 106 32
      Q 74 31 66 62
      Z"/>
  </g>

  <!-- Sealed package crate the sprout grows out of. -->
  <g>
    <rect x="36" y="84" width="56" height="24" rx="6" fill="url(#sow-crate)"/>
    <rect x="59.5" y="84" width="9" height="24" fill="#0b1119" fill-opacity="0.32"/>
    <rect x="36" y="94" width="56" height="4" fill="#0b1119" fill-opacity="0.26"/>
  </g>
</svg>
