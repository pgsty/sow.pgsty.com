{{- /* Render the page annotation's lines via OINK's standard annotation-items
     resolver while keeping the partial file present in the repository. */ -}}
{{- $items := partial "annotation-items.html" . -}}
{{- with $items }}
<div class="td-page-meta__footer">
  {{- range . }}
  <div class="td-page-meta__item td-page-meta__{{ .key }}">
    <span class="td-page-meta__icon"><i class="{{ .icon }}" aria-hidden="true"></i></span>
    <span>{{ .html | safeHTML }}</span>
  </div>
  {{- end }}
</div>
{{ end -}}
