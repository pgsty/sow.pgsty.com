#=======================================#
# Basics
#=======================================#
baseURL: https://sow.pgsty.com/
title: SOW - Software Object Warehouse
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true
# 标签等列表页标题保留作者原始大小写。
capitalizeListTitles: false

#=======================================#
# Hugo Module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink

#=======================================#
# Languages and navigation
#=======================================#
languages:
  en:
    label: English
    locale: en
    weight: 1
    title: SOW
    params:
      description: "Software Object Warehouse by Pigsty: a self-contained APT / YUM package repository manager."
      time_format_blog: 'January 02, 2006'
    menu:
      main:
        - identifier: docs
          name: Docs
          weight: 10
          url: /docs/
          pre: <i class='fa-solid fa-book'></i>
        - identifier: blog
          name: Blog
          weight: 20
          url: /blog/
          pre: <i class='fa-solid fa-blog'></i>
        - identifier: download
          name: Download
          weight: 25
          url: /download/
          pre: <i class='fa-solid fa-download'></i>
        - identifier: pigsty
          name: Pigsty
          weight: 30
          url: https://pigsty.io
          pre: <i class='fa-solid fa-database'></i>
        - identifier: github
          name: GitHub
          weight: 40
          url: https://github.com/pgsty/sow
          pre: <i class='fa-brands fa-github'></i>
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: SOW
    params:
      description: "SOW：Pigsty 出品的自包含 APT / YUM 软件仓库管理器。"
      time_format_blog: '2006年01月02日'
    menu:
      main:
        - identifier: docs
          name: 文档
          weight: 10
          url: /zh/docs/
          pre: <i class='fa-solid fa-book'></i>
        - identifier: blog
          name: 博客
          weight: 20
          url: /zh/blog/
          pre: <i class='fa-solid fa-blog'></i>
        - identifier: download
          name: 下载
          weight: 25
          url: /zh/download/
          pre: <i class='fa-solid fa-download'></i>
        - identifier: pigsty
          name: Pigsty
          weight: 30
          url: https://pigsty.cc
          pre: <i class='fa-solid fa-database'></i>
        - identifier: github
          name: GitHub
          weight: 40
          url: https://github.com/pgsty/sow
          pre: <i class='fa-brands fa-github'></i>

#=======================================#
# Taxonomies and blog URLs
#=======================================#
taxonomies:
  categories: categories
  tags: tags

permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# Markdown and syntax highlighting
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          inline:
            - ['\(', '\)']
          block:
            - ['$$', '$$']
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home: [HTML, RSS, JSON, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

#=======================================#
# Services
#=======================================#
services:
  # Google Analytics 4：仅生产构建注入（OINK head.html / layouts/index.html
  # 都用 hugo.IsProduction 包裹），本地 hugo server 不会加载埋点。
  googleAnalytics:
    id: G-K5J5RV8H58

#=======================================#
# Site parameters
#=======================================#
params:
  description: "SOW is the Software Object Warehouse by Pigsty: one self-contained binary that builds and manages APT / YUM package repositories on Linux and macOS."
  logo: img/sow.svg
  images:
    - images/sow-social-card.png
  version: 0.2.0
  copyright:
    authors: PIGSTY & SOW Contributors
    from_year: 2026
    url: https://pgsty.com

  # 正文列宽模式：normal（1050px，默认）| wide（1300px）| full（占满可用宽）。
  page_width: normal
  # ICP 备案号（留空则不渲染）。
  footer_icp: ""

  archived_version: false
  url_latest_version: https://sow.pgsty.com
  github_repo: https://github.com/pgsty/sow.pgsty.com
  github_project_repo: https://github.com/pgsty/sow
  github_branch: main

  # 文档与博客使用 OINK 自带的同源离线搜索；独立首页保留自己的同源入口。
  offlineSearch: true
  offlineSearchIndex: content
  offlineSearchMaxResults: 10
  prism_syntax_highlighting: false

  ui:
    quick_links: [docs, blog]
    breadcrumb_disable: false
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    navbar_theme: dark
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_root_enabled: true
    ul_show: 2
    showLightDarkModeMenu: true
    scrollSpy:
      disable: true
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    page_context_menu:
      enable: true
      links: []
    feedback:
      enable: false
    readingtime:
      enable: false

  links:
    user:
      - name: SOW source
        url: https://github.com/pgsty/sow
        icon: fab fa-github
        desc: SOW source repository
      - name: Pigsty
        url: https://pigsty.io
        icon: fa fa-database
        desc: Pigsty project
    developer:
      - name: Releases
        url: https://github.com/pgsty/sow/releases
        icon: fa fa-box-archive
        desc: SOW release artifacts
      - name: Documentation source
        url: https://github.com/pgsty/sow.pgsty.com
        icon: fab fa-github
        desc: SOW documentation repository
