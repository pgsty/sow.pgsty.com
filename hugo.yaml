#=======================================#
# Basics
#=======================================#
baseURL: https://sow.pgsty.com/
title: SOW - Software Object Warehouse
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true
# 标签等列表页标题保留作者原始大小写。
capitalizeListTitles: false

#=======================================#
# Hugo Module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink

#=======================================#
# Languages and navigation
#=======================================#
languages:
  en:
    label: English
    locale: en
    weight: 1
    title: SOW
    params:
      description: "Software Object Warehouse by Pigsty: a self-contained APT / YUM package repository manager."
      time_format_blog: 'January 02, 2006'
      ui:
        command_palette:
          commands:
            - id: quick_start
              title: Quick Start
              description: Build and serve a repository in five steps
              url: /docs/start/quickstart/
              icon: fa-solid fa-bolt
              keywords: [start, create, plain, repository]
            - id: cli_reference
              title: CLI Reference
              description: Look up every SOW command and option
              url: /docs/command/
              icon: fa-solid fa-terminal
              keywords: [command, option, help, reference]
    menu:
      main:
        - identifier: docs
          name: Docs
          pageRef: /docs
          weight: 10
          params:
            icon: fa-solid fa-book
        - identifier: get-started
          parent: docs
          name: Get Started
          pageRef: /docs/start
          weight: 10
          params:
            icon: fa-solid fa-rocket
            description: Install SOW and build your first repository
        - identifier: tutorials
          parent: docs
          name: Tutorials
          pageRef: /docs/tutorial
          weight: 20
          params:
            icon: fa-solid fa-graduation-cap
            description: Follow complete YUM, APT, signing, and serving guides
        - identifier: commands
          parent: docs
          name: Commands
          pageRef: /docs/command
          weight: 30
          params:
            icon: fa-solid fa-terminal
            description: Look up exact CLI syntax and behavior
        - identifier: reference
          parent: docs
          name: Reference
          pageRef: /docs/reference
          weight: 40
          params:
            icon: fa-solid fa-book-open
            description: Check configuration, formats, paths, and compatibility
        - identifier: blog
          name: Blog
          pageRef: /blog
          weight: 20
          params:
            icon: fa-solid fa-blog
        - identifier: download
          name: Download
          pageRef: /download
          weight: 25
          params:
            icon: fa-solid fa-download
        - identifier: pigsty
          name: Pigsty
          weight: 30
          url: https://pigsty.io
          params:
            icon: fa-solid fa-database
        - identifier: github
          name: GitHub
          weight: 40
          url: https://github.com/pgsty/sow
          params:
            icon: fa-brands fa-github
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: SOW
    params:
      description: "SOW：Pigsty 出品的自包含 APT / YUM 软件仓库管理器。"
      time_format_blog: '2006年01月02日'
      ui:
        command_palette:
          commands:
            - id: quick_start
              title: 快速上手
              description: 五步构建并对外服务软件仓库
              icon: fa-solid fa-bolt
              keywords: [上手, 创建, 平面仓库, 软件源]
            - id: cli_reference
              title: CLI 命令参考
              description: 查询每一条 SOW 命令与参数
              icon: fa-solid fa-terminal
              keywords: [命令, 参数, 帮助, 参考]
    menu:
      main:
        - identifier: docs
          name: 文档
          pageRef: /docs
          weight: 10
          params:
            icon: fa-solid fa-book
        - identifier: get-started
          parent: docs
          name: 上手
          pageRef: /docs/start
          weight: 10
          params:
            icon: fa-solid fa-rocket
            description: 安装 SOW 并构建第一个软件仓库
        - identifier: tutorials
          parent: docs
          name: 教程
          pageRef: /docs/tutorial
          weight: 20
          params:
            icon: fa-solid fa-graduation-cap
            description: 完成 YUM、APT、签名与服务实战
        - identifier: commands
          parent: docs
          name: 命令
          pageRef: /docs/command
          weight: 30
          params:
            icon: fa-solid fa-terminal
            description: 查询精确 CLI 语法与行为
        - identifier: reference
          parent: docs
          name: 参考
          pageRef: /docs/reference
          weight: 40
          params:
            icon: fa-solid fa-book-open
            description: 核对配置、格式、路径与兼容性
        - identifier: blog
          name: 博客
          pageRef: /blog
          weight: 20
          params:
            icon: fa-solid fa-blog
        - identifier: download
          name: 下载
          pageRef: /download
          weight: 25
          params:
            icon: fa-solid fa-download
        - identifier: pigsty
          name: Pigsty
          weight: 30
          url: https://pigsty.cc
          params:
            icon: fa-solid fa-database
        - identifier: github
          name: GitHub
          weight: 40
          url: https://github.com/pgsty/sow
          params:
            icon: fa-brands fa-github

#=======================================#
# Taxonomies and blog URLs
#=======================================#
taxonomies:
  categories: categories
  tags: tags

permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# Markdown and syntax highlighting
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          inline:
            - ['\(', '\)']
          block:
            - ['$$', '$$']
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

#=======================================#
# Services
#=======================================#
services:
  # Google Analytics 4：仅生产构建注入（OINK head.html / layouts/index.html
  # 都用 hugo.IsProduction 包裹），本地 hugo server 不会加载埋点。
  googleAnalytics:
    id: G-K5J5RV8H58

#=======================================#
# Site parameters
#=======================================#
params:
  description: "SOW is the Software Object Warehouse by Pigsty: one self-contained binary that builds and manages APT / YUM package repositories on Linux and macOS."
  logo: img/sow.svg
  images:
    - images/sow-social-card.png
  # Current released version.
  version: 0.3.0
  copyright:
    authors: '[PIGSTY & SOW Contributors](https://pgsty.com) · [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)'
    from_year: 2026

  # 正文列宽模式：normal（1050px，默认）| wide（1300px）| full（占满可用宽）。
  page_width: normal
  # ICP 备案号（留空则不渲染）。
  footer_icp: ""

  archived_version: false
  url_latest_version: https://sow.pgsty.com
  github_repo: https://github.com/pgsty/sow.pgsty.com
  github_project_repo: https://github.com/pgsty/sow
  github_branch: main

  # 文档、博客与 OINK 首页共用同源离线搜索。
  offlineSearch: true
  offlineSearchIndex: content
  offlineSearchMaxResults: 10
  prism_syntax_highlighting: false

  ui:
    # OINK applies the shared shell to product-specific content types.
    shell_types: [docs, blog, swagger, download]
    quick_links: [docs, blog, download]
    sidebar_icon_policy: groups
    typography:
      preset: technical
    breadcrumb_disable: false
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    navbar_theme: dark
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_root_enabled: true
    ul_show: 2
    showLightDarkModeMenu: true
    scrollSpy:
      disable: true
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    page_context_menu:
      enable: true
      # Keep assistant hand-offs opt-in: activating one discloses the full URL.
      assistant_links: false
      links: []
    feedback:
      enable: false
    readingtime:
      enable: false

  links:
    user:
      - name: SOW source
        url: https://github.com/pgsty/sow
        icon: fab fa-github
        desc: SOW source repository
      - name: Pigsty
        url: https://pigsty.io
        icon: fa fa-database
        desc: Pigsty project
    developer:
      - name: Releases
        url: https://github.com/pgsty/sow/releases
        icon: fa fa-box-archive
        desc: SOW release artifacts
      - name: Docs source
        url: https://github.com/pgsty/sow.pgsty.com
        icon: fab fa-github
        desc: SOW docs repository
